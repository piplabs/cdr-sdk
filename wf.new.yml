name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: http://23.102.74.209:8080

jobs:
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Create .env.test
        run: |
          cat > .env.test << 'EOF'
          BASE_URL=${{ env.BASE_URL }}
          TEST_DESIGNER_PRIVATE_KEY=${{ secrets.TEST_DESIGNER_PRIVATE_KEY }}
          TEST_MANUFACTURER_PRIVATE_KEY=${{ secrets.TEST_MANUFACTURER_PRIVATE_KEY }}
          TEST_CONSUMER_PRIVATE_KEY=${{ secrets.TEST_CONSUMER_PRIVATE_KEY }}
          TEST_UNAUTHORIZED_PRIVATE_KEY=${{ secrets.TEST_UNAUTHORIZED_PRIVATE_KEY }}
          TEST_ADMIN_PRIVATE_KEY=${{ secrets.TEST_ADMIN_PRIVATE_KEY }}
          EOF

      - name: Health check
        run: |
          echo "Checking deployment health..."
          curl -sf ${{ env.BASE_URL }}/api/categories > /dev/null || (echo "Deployment unreachable!" && exit 1)
          echo "Deployment is healthy."

      - name: Run API integration tests
        run: pnpm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          if-no-files-found: ignore

  i18n-tests:
    name: i18n Page Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: api-tests

    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run i18n tests
        run: pnpm test:i18n
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
