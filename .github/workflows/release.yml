name: Release

# Publish to npm. Triggers ONLY on main pushes whose commit message contains
# the marker string "chore: release packages" — the default title of the auto-
# generated Version Packages PR (changesets/action input `title`, default
# value). Ordinary chore / docs / feature / CI commits to main are filtered
# out at the job-level `if` guard and do not consume environment approval.
#
# The Version Packages PR itself is opened and maintained by bot-sync.yml
# (a separate workflow that runs on every main push). Splitting the two
# workflows means a single failing audit / test on main never blocks the
# bot — only the actual publish path is gated.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    # The publish job is gated entirely on the commit message marker. If a
    # maintainer manually renames the auto-PR title before merging, this
    # guard fails closed and no publish happens — RELEASING.md documents
    # this constraint as a load-bearing operational rule.
    if: |
      contains(github.event.head_commit.message, 'chore: release packages')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write   # push git tags + create GitHub Releases
      id-token: write   # mint OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Supply-chain gate. Audit production dependencies (the deps that ship
      # to consumers) for high+ severity vulnerabilities. devDependencies are
      # excluded — they don't make it into the published tarball.
      #
      # `pnpm audit` exits 0 even when vulnerabilities exist (the
      # --audit-level flag is a print filter, not a failure threshold), so
      # we parse JSON and explicitly fail on any high or critical advisory.
      # Suppress specific transitive vulns by adding a pnpm.overrides entry
      # in the root package.json once a fixed version is available.
      - name: Audit production dependencies
        run: |
          pnpm audit --json --prod > /tmp/audit.json || true
          COUNT=$(jq '[.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/audit.json)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::error::Found $COUNT high+ severity vulnerabilities in production deps"
            jq '[.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .value | {severity, title, module: .module_name, vulnerable: .vulnerable_versions, patched: .patched_versions}]' /tmp/audit.json
            exit 1
          fi
          echo "No high+ severity vulnerabilities in production deps."

      - run: pnpm -r run build

      # Pre-publish dry-run. Validates tarball contents (file list, package.json
      # shape, workspace:* substitution) without contacting the registry to
      # write. Catches regressions in `files` whitelists or workspace dep
      # resolution before any tarball is irrevocably uploaded.
      - name: Verify publish tarballs (dry-run)
        # Dry-run does not contact the registry; no auth needed.
        run: pnpm -r publish --dry-run --no-git-checks

      - name: Publish to npm
        # Authentication is via npm Trusted Publishing: each of the four
        # packages has this workflow (piplabs/cdr-sdk, release.yml,
        # environment=npm-publish) configured as a trusted publisher in its
        # npm package settings. The GHA OIDC token (id-token: write below) is
        # exchanged for a short-lived npm publish token at publish time —
        # no long-lived NPM_TOKEN secret is needed in this repo.
        #
        # NOTE: NPM_TOKEN must NOT be set in the env block. If both an
        # NPM_TOKEN and an OIDC trusted-publisher path are available, npm
        # CLI preferentially uses NPM_TOKEN, which bypasses the trusted-
        # publisher contract and reintroduces the 404/provenance failure.
        run: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Emit OIDC-signed provenance so consumers can verify the tarball
          # was produced by this workflow.
          NPM_CONFIG_PROVENANCE: "true"
