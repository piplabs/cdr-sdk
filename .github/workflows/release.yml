name: Release

# Manual, version-input release. Click "Run workflow", type the exact version
# (e.g. 0.2.2), and this publishes all four packages to npm at that version.
#
# Flow (single run, no second trigger):
#   prepare  — validate version + bump all 4 package.json + build + audit +
#              dry-run publish. NO external effect; the bump lives only on the
#              throwaway runner. Gives the reviewer a green pre-flight.
#   publish  — gated by the `npm-publish` environment (required reviewer). On
#              approval: publish to npm (OIDC + provenance), then push the
#              version-bump commit + `v<version>` tag to main, then open a
#              GitHub Release. Holding off approval = nothing goes live.
#
# Versions move in lockstep: all four packages are set to the input version.
# Internal `workspace:*` deps are left as-is; pnpm rewrites them to the real
# version at publish time.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release all four packages at (e.g. 0.2.2)'
        required: true
        type: string

concurrency: release-${{ github.ref }}

env:
  PACKAGES: "packages/contracts packages/crypto packages/sdk apps/cli"

jobs:
  # ---------------------------------------------------------------------------
  # Pre-flight. Runs immediately, no environment gate, no external side effects.
  # Proves the requested version is valid and the four packages build + pack
  # cleanly BEFORE a reviewer is asked to approve the irreversible publish.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Must be plain semver (optionally a -prerelease / +build suffix).
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version (expected e.g. 0.2.2)"
            exit 1
          fi
          # Must be strictly greater than what's currently on npm `latest`.
          LATEST="$(npm view @piplabs/cdr-sdk version 2>/dev/null || echo '0.0.0')"
          if [ "$VERSION" = "$LATEST" ] || \
             [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::Version $VERSION must be greater than current npm latest ($LATEST)"
            exit 1
          fi
          echo "OK: $VERSION > $LATEST"

      - name: Set version across all four packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for dir in $PACKAGES; do
            ( cd "$dir" && npm pkg set version="$VERSION" )
            echo "  $dir -> $VERSION"
          done

      - run: pnpm install --no-frozen-lockfile

      # Supply-chain gate: fail on high+ severity vulnerabilities in the deps
      # that actually ship to consumers (prod deps; devDeps are excluded).
      - name: Audit production dependencies
        run: |
          pnpm audit --json --prod > /tmp/audit.json || true
          COUNT=$(jq '[.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")] | length' /tmp/audit.json)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::error::Found $COUNT high+ severity vulnerabilities in production deps"
            jq '[.advisories | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .value | {severity, title, module: .module_name, vulnerable: .vulnerable_versions, patched: .patched_versions}]' /tmp/audit.json
            exit 1
          fi
          echo "No high+ severity vulnerabilities in production deps."

      - run: pnpm -r run build

      # Validates tarball contents (file lists, package.json shape, workspace:*
      # substitution) without contacting the registry. Catches packaging
      # regressions before the publish job is ever approved.
      - name: Verify publish tarballs (dry-run)
        run: pnpm -r publish --dry-run --no-git-checks

  # ---------------------------------------------------------------------------
  # Publish. Gated by the `npm-publish` environment — a required reviewer must
  # click "Approve and deploy" before ANY step here runs. This is the single
  # irreversible point. Everything below happens only after approval.
  # ---------------------------------------------------------------------------
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write   # push the version-bump commit + tag, create the Release
      id-token: write   # mint OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          # No registry-url: that writes an .npmrc with a placeholder auth
          # token that breaks the OIDC trusted-publisher path. Default registry
          # is correct; auth is via OIDC, not a stored token.

      # npm 11+ is required for the OIDC Trusted Publisher token exchange.
      # Node 20 ships npm 10.x; `pnpm publish` delegates the actual PUT to npm.
      - name: Upgrade npm to support OIDC Trusted Publisher
        run: |
          npm install -g npm@latest
          npm --version

      # Record the previous release tag now, before we add the new one, so the
      # GitHub Release notes can list every commit since the last release.
      - name: Capture previous release tag
        id: prev
        run: |
          PREV="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${PREV:-<none>}"

      - name: Set version across all four packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for dir in $PACKAGES; do
            ( cd "$dir" && npm pkg set version="$VERSION" )
          done

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm -r run build

      # The irreversible step. Auth is npm Trusted Publishing (OIDC): this repo
      # + this workflow + the `npm-publish` environment are configured as a
      # trusted publisher on each package. No NPM_TOKEN — if one were set, npm
      # would prefer it and bypass the trusted-publisher contract.
      - name: Publish to npm
        run: pnpm -r publish --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Only after a successful publish do we record the release in git, so main
      # never advertises a version that didn't actually reach npm.
      - name: Commit version bump, tag, and push to main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # Notes = every commit since the previous release tag. Placeholder content
      # for maintainers to edit afterwards.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
          NOTES="$(git log $RANGE --no-merges --pretty=format:'- %s (%h)')"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "${NOTES:-_No commits found since previous release._}"
