name: Post-Release Integration

# Smoke-tests the actually-published npm tarballs (NOT the workspace source
# tree that integration.yml exercises). Catches consumer-only defects like
# missing exports/engines fields, version-stamp drift, and partial / non-
# lockstep releases. See issue #102 for the full motivation.
#
# Triggers:
#   - workflow_run: fires after every Release workflow completion. The
#     job-level `if` further gates on (a) the upstream run succeeded and
#     (b) the head commit carried the publish marker — mirroring the gate
#     in release.yml — so non-publish main pushes don't spam empty runs.
#   - workflow_dispatch: manual rerun. Optional `version` input overrides
#     the registry-latest lookup; useful for re-verifying an older release
#     or for testing this workflow from a feature branch before merge.
#
# Testing from a branch: once this file lands on a branch in origin,
# Actions → "Post-Release Integration" → Run workflow → pick the branch.
# Pushing the workflow file to origin/main is NOT a prerequisite for the
# manual dispatch path; only the workflow_run path requires the file to
# be on the default branch.

run-name: post-release-${{ inputs.version || github.event.workflow_run.head_sha || 'latest' }}

permissions:
  contents: read

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (empty = resolve from npm latest)'
        required: false
        default: ''

# Coalesce concurrent runs that target the same version. We don't
# cancel-in-progress — a manual rerun while the auto-run is still going
# should queue, not kill, so we still get the auto-trigger's signal.
concurrency:
  group: post-release-${{ inputs.version || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    # workflow_dispatch is always allowed. workflow_run fires for every
    # Release completion (including main pushes that didn't publish — the
    # publish job in release.yml is gated on the commit-message marker and
    # skips quietly otherwise), so we additionally require both upstream
    # success and the publish marker to be present.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         contains(github.event.workflow_run.head_commit.message, 'chore: release packages'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve canonical version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            SOURCE="workflow_dispatch input"
          else
            # npm view writes the version string to stdout and exits 0 on
            # success, exits 1 with an E404 if the package is missing. We
            # treat any non-zero exit or empty stdout as a hard failure —
            # this is the canonical source of truth for "what was just
            # released" and anything else means the registry is in a state
            # we don't understand.
            VERSION="$(npm view @piplabs/cdr-sdk version)"
            SOURCE="npm view @piplabs/cdr-sdk (latest)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::failed to resolve canonical version"
            exit 1
          fi
          echo "Resolved version: $VERSION (source: $SOURCE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE"   >> "$GITHUB_OUTPUT"

      - name: Verify lockstep release across all four packages
        id: lockstep
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -uo pipefail
          PACKAGES=(@piplabs/cdr-contracts @piplabs/cdr-crypto @piplabs/cdr-sdk @piplabs/cdr-cli)
          FAILED=()
          ROWS=()
          for pkg in "${PACKAGES[@]}"; do
            # Require BOTH: `npm view <pkg>@<ver> version` exits 0 AND its
            # stdout exactly equals the requested version. A registry mirror
            # lag or cache quirk could in principle return a different
            # version string under the same query — comparing the value
            # belt-and-braces guards against that.
            ACTUAL="$(npm view "${pkg}@${VERSION}" version 2>/dev/null || true)"
            if [ "$ACTUAL" = "$VERSION" ]; then
              ROWS+=("| \`${pkg}\` | \`${VERSION}\` | ✅ |")
            else
              ROWS+=("| \`${pkg}\` | \`${ACTUAL:-(not found)}\` | ❌ |")
              FAILED+=("$pkg")
            fi
          done
          {
            echo "rows<<ROWS_EOF"
            printf '%s\n' "${ROWS[@]}"
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Lockstep verification failed — these packages are not published at ${VERSION}: ${FAILED[*]}"
            exit 1
          fi
          echo "Lockstep verified: all four packages published at ${VERSION}"

      - name: Write run summary
        if: always()
        # GH_EVENT_NAME / GH_SHA are GH-controlled so they're safe inline,
        # but threading them through env is the house style (see
        # integration.yml:108) so a future copy-paste doesn't accidentally
        # introduce an untrusted-input injection.
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SOURCE: ${{ steps.resolve.outputs.source }}
          LOCKSTEP_OUTCOME: ${{ steps.lockstep.outcome }}
          ROWS: ${{ steps.lockstep.outputs.rows }}
        run: |
          set -u
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❔" ;;
            esac
          }
          {
            echo "## Post-release integration — \`${VERSION:-(unresolved)}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${GH_EVENT_NAME}\` |"
            echo "| Commit | \`${GH_SHA}\` |"
            echo "| Version | \`${VERSION:-(unresolved)}\` |"
            echo "| Version source | ${SOURCE:-(n/a)} |"
            echo "| Lockstep | $(icon "${LOCKSTEP_OUTCOME:-skipped}") \`${LOCKSTEP_OUTCOME:-skipped}\` |"
            echo ""
            echo "### Lockstep verification"
            echo ""
            if [ -n "${ROWS:-}" ]; then
              echo "| Package | Found | Status |"
              echo "|---|---|---|"
              echo "${ROWS}"
            else
              echo "_(lockstep step did not run — version resolution likely failed)_"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    # Clean-room verification: install the actually-published tarballs into
    # a temp dir OUTSIDE the workspace, then run the gates the workspace
    # build can't catch — package.json field audit (#97/#98), CJS + ESM
    # import smoke, and `cdr-cli --version` strict equality (#96).
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Pin Node 20 (LTS, matches integration.yml:144-147). Without this,
      # the runner's default Node version drifts and changes the CJS-bridge
      # behavior in the smoke step below — see the comment on the CJS smoke
      # step for the full reasoning.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install packages in clean temp dir
        id: install
        run: |
          set -euo pipefail
          # mktemp outside $GITHUB_WORKSPACE so pnpm/npm workspace
          # resolution can't influence anything — we want the same
          # conditions a fresh consumer machine would see.
          INSTALL_DIR="$(mktemp -d -t cdr-release-XXXXXX)"
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          cd "$INSTALL_DIR"
          npm init -y > /dev/null
          # --no-package-lock: we don't care about reproducibility, we
          # care about "what does `npm install @piplabs/...@$VERSION`
          # give a consumer right now". Skipping the lockfile keeps the
          # temp dir slim and removes a moving part.
          npm install --no-package-lock \
            "@piplabs/cdr-contracts@${VERSION}" \
            "@piplabs/cdr-crypto@${VERSION}" \
            "@piplabs/cdr-sdk@${VERSION}" \
            "@piplabs/cdr-cli@${VERSION}"
          echo "Installed in: $INSTALL_DIR"
          ls -la node_modules/@piplabs/

      - name: Audit package.json fields
        id: audit
        run: |
          set -uo pipefail
          # Per-package required fields:
          #   libraries (contracts/crypto/sdk): engines, exports, main, types
          #   cli:                              engines, bin
          # `module` is reported separately as informational — it's a
          # legacy bundler convention that modern ESM packages with a
          # proper `exports` map don't need, so we don't fail on it.
          FAILED=()
          ROWS=()

          # Returns "OK" if the field is present and non-empty, else "FAIL".
          # Empty objects (`{}`) and empty strings count as missing — they
          # indicate the field was declared but left blank, which is the
          # same consumer-visible state as omission.
          check_field() {
            local pkg="$1"
            local field="$2"
            local pkgjson="${INSTALL_DIR}/node_modules/${pkg}/package.json"
            if [ ! -f "$pkgjson" ]; then echo "MISSING_FILE"; return; fi
            local val
            val=$(jq -c --arg f "$field" '.[$f] // empty' "$pkgjson")
            if [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = "{}" ] || [ "$val" = "\"\"" ]; then
              echo "FAIL"
            else
              echo "OK"
            fi
          }

          # Libraries
          for pkg in @piplabs/cdr-contracts @piplabs/cdr-crypto @piplabs/cdr-sdk; do
            for field in engines exports main types; do
              status=$(check_field "$pkg" "$field")
              if [ "$status" = "OK" ]; then
                ROWS+=("| \`${pkg}\` | \`${field}\` | required | ✅ |")
              else
                ROWS+=("| \`${pkg}\` | \`${field}\` | required | ❌ |")
                FAILED+=("${pkg}#${field}")
              fi
            done
            # module: report only, don't fail
            mod_status=$(check_field "$pkg" "module")
            if [ "$mod_status" = "OK" ]; then
              ROWS+=("| \`${pkg}\` | \`module\` | informational | ✅ |")
            else
              ROWS+=("| \`${pkg}\` | \`module\` | informational | ⚠️ missing |")
            fi
          done

          # CLI
          for field in engines bin; do
            status=$(check_field "@piplabs/cdr-cli" "$field")
            if [ "$status" = "OK" ]; then
              ROWS+=("| \`@piplabs/cdr-cli\` | \`${field}\` | required | ✅ |")
            else
              ROWS+=("| \`@piplabs/cdr-cli\` | \`${field}\` | required | ❌ |")
              FAILED+=("@piplabs/cdr-cli#${field}")
            fi
          done

          {
            echo "rows<<ROWS_EOF"
            printf '%s\n' "${ROWS[@]}"
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::Field audit failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "Field audit passed"

      - name: 'Smoke: ESM imports'
        id: esm_smoke
        if: always() && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          cd "$INSTALL_DIR"
          # Dynamic import lets one .mjs file smoke-test any package by
          # name. Top-level await is fine on Node 20 (the runner default).
          cat > smoke.mjs <<'JSEOF'
          const pkgName = process.argv[2];
          try {
            const pkg = await import(pkgName);
            const keys = Object.keys(pkg);
            if (keys.length === 0) {
              throw new Error(`empty namespace from ${pkgName}`);
            }
            console.log(`OK ${pkgName}: ${keys.length} export(s) — ${keys.slice(0, 4).join(", ")}${keys.length > 4 ? ", ..." : ""}`);
          } catch (err) {
            console.error(`FAIL ${pkgName}: ${err && err.message ? err.message : err}`);
            process.exit(1);
          }
          JSEOF
          FAILED=()
          ROWS=()
          for pkg in @piplabs/cdr-contracts @piplabs/cdr-crypto @piplabs/cdr-sdk; do
            if OUTPUT=$(node smoke.mjs "$pkg" 2>&1); then
              SHORT=$(echo "$OUTPUT" | head -1 | tr -d '`' | tr '|' '/')
              ROWS+=("| \`${pkg}\` | ✅ | ${SHORT:0:140} |")
            else
              SHORT=$(echo "$OUTPUT" | head -1 | tr -d '`' | tr '|' '/')
              ROWS+=("| \`${pkg}\` | ❌ | ${SHORT:0:140} |")
              FAILED+=("$pkg")
            fi
          done
          {
            echo "rows<<ROWS_EOF"
            printf '%s\n' "${ROWS[@]}"
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::ESM smoke failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "ESM smoke passed for all libraries"

      - name: 'Smoke: CJS imports'
        id: cjs_smoke
        # Hard-fail per design — even though the v0.2.1 packages don't
        # support require() yet (issue #97), the team's stated direction
        # is to dual-publish CJS + ESM, so this gate must enforce that
        # contract once shipped.
        #
        # NODE_OPTIONS=--no-experimental-require-module disables Node's
        # implicit ESM-bridge for require(). Without it, Node 20.19+ and
        # 22.12+ will silently bridge `require("@piplabs/cdr-sdk")` even
        # when the package is ESM-only with no exports.require — defeating
        # the gate. With the flag, require() returns the original
        # ERR_REQUIRE_ESM if the package hasn't declared CJS support, so
        # we catch the missing exports.require / .cjs main entry that
        # consumers on Node <20.19 (still LTS-supported) actually need.
        if: always() && steps.install.outcome == 'success'
        env:
          NODE_OPTIONS: --no-experimental-require-module
        run: |
          set -uo pipefail
          cd "$INSTALL_DIR"
          # .cjs forces CommonJS regardless of the nearest package.json's
          # `type` field — so this test exercises the require() resolution
          # path even when the temp dir's package.json gets `type: module`.
          cat > smoke.cjs <<'JSEOF'
          const pkgName = process.argv[2];
          try {
            const pkg = require(pkgName);
            if (!pkg || (typeof pkg === "object" && Object.keys(pkg).length === 0)) {
              throw new Error(`empty exports from ${pkgName}`);
            }
            const keys = typeof pkg === "object" ? Object.keys(pkg) : [typeof pkg];
            console.log(`OK ${pkgName}: ${keys.length} export(s) — ${keys.slice(0, 4).join(", ")}${keys.length > 4 ? ", ..." : ""}`);
          } catch (err) {
            console.error(`FAIL ${pkgName}: ${err && err.code ? err.code + ": " : ""}${err && err.message ? err.message : err}`);
            process.exit(1);
          }
          JSEOF
          FAILED=()
          ROWS=()
          for pkg in @piplabs/cdr-contracts @piplabs/cdr-crypto @piplabs/cdr-sdk; do
            if OUTPUT=$(node smoke.cjs "$pkg" 2>&1); then
              SHORT=$(echo "$OUTPUT" | head -1 | tr -d '`' | tr '|' '/')
              ROWS+=("| \`${pkg}\` | ✅ | ${SHORT:0:140} |")
            else
              SHORT=$(echo "$OUTPUT" | head -1 | tr -d '`' | tr '|' '/')
              ROWS+=("| \`${pkg}\` | ❌ | ${SHORT:0:140} |")
              FAILED+=("$pkg")
            fi
          done
          {
            echo "rows<<ROWS_EOF"
            printf '%s\n' "${ROWS[@]}"
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::CJS smoke failed for: ${FAILED[*]}"
            exit 1
          fi
          echo "CJS smoke passed for all libraries"

      - name: 'Verify cdr-cli --version'
        id: cli_version
        if: always() && steps.install.outcome == 'success'
        run: |
          set -uo pipefail
          cd "$INSTALL_DIR"
          # `npx --package=…@<ver>` pins the exact version so a stale
          # globally-cached cdr-cli on the runner can't shadow what we
          # just installed. The `cdr-cli` token after --package is the
          # bin name; `--version` is passed through to the bin.
          ACTUAL_RAW=$(npx --package="@piplabs/cdr-cli@${VERSION}" cdr-cli --version 2>&1 || true)
          # Strict equality per issue #102: stdout (trimmed) must equal
          # the resolved version. The motivating bug (#96) shipped
          # "0.1.2" against a 0.2.1 package — exact match is the only
          # check that catches that class of drift.
          TRIMMED=$(printf '%s' "$ACTUAL_RAW" | tr -d '[:space:]')
          echo "actual=${ACTUAL_RAW}" >> "$GITHUB_OUTPUT"
          echo "trimmed=${TRIMMED}" >> "$GITHUB_OUTPUT"
          if [ "$TRIMMED" = "$VERSION" ]; then
            echo "result=match" >> "$GITHUB_OUTPUT"
            echo "cdr-cli --version matches: ${TRIMMED}"
          else
            echo "result=mismatch" >> "$GITHUB_OUTPUT"
            echo "::error::cdr-cli --version mismatch — expected '${VERSION}', got '${ACTUAL_RAW}'"
            exit 1
          fi

      - name: Write verify summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_ROWS: ${{ steps.audit.outputs.rows }}
          ESM_OUTCOME: ${{ steps.esm_smoke.outcome }}
          ESM_ROWS: ${{ steps.esm_smoke.outputs.rows }}
          CJS_OUTCOME: ${{ steps.cjs_smoke.outcome }}
          CJS_ROWS: ${{ steps.cjs_smoke.outputs.rows }}
          CLI_OUTCOME: ${{ steps.cli_version.outcome }}
          CLI_ACTUAL: ${{ steps.cli_version.outputs.actual }}
          CLI_RESULT: ${{ steps.cli_version.outputs.result }}
        run: |
          set -u
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❔" ;;
            esac
          }
          {
            echo "## Clean-room verification — \`${VERSION:-(unresolved)}\`"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Field audit | $(icon "${AUDIT_OUTCOME:-skipped}") \`${AUDIT_OUTCOME:-skipped}\` |"
            echo "| ESM import smoke | $(icon "${ESM_OUTCOME:-skipped}") \`${ESM_OUTCOME:-skipped}\` |"
            echo "| CJS import smoke | $(icon "${CJS_OUTCOME:-skipped}") \`${CJS_OUTCOME:-skipped}\` |"
            echo "| \`cdr-cli --version\` | $(icon "${CLI_OUTCOME:-skipped}") \`${CLI_OUTCOME:-skipped}\` |"
            echo ""

            echo "### Field audit"
            echo ""
            if [ -n "${AUDIT_ROWS:-}" ]; then
              echo "| Package | Field | Tier | Status |"
              echo "|---|---|---|---|"
              echo "${AUDIT_ROWS}"
            else
              echo "_(field audit did not run — install likely failed)_"
            fi
            echo ""

            echo "### ESM import smoke"
            echo ""
            if [ -n "${ESM_ROWS:-}" ]; then
              echo "| Package | Status | Output |"
              echo "|---|---|---|"
              echo "${ESM_ROWS}"
            else
              echo "_(ESM smoke did not run)_"
            fi
            echo ""

            echo "### CJS import smoke"
            echo ""
            if [ -n "${CJS_ROWS:-}" ]; then
              echo "| Package | Status | Output |"
              echo "|---|---|---|"
              echo "${CJS_ROWS}"
            else
              echo "_(CJS smoke did not run)_"
            fi
            echo ""

            echo "### CLI version check"
            echo ""
            echo "| Expected | Got | Result |"
            echo "|---|---|---|"
            echo "| \`${VERSION:-?}\` | \`${CLI_ACTUAL:-(no output)}\` | $(icon "${CLI_OUTCOME:-skipped}") ${CLI_RESULT:-skipped} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-aeneid:
    # End-to-end gate against a live Aeneid validator set, using a fresh
    # subwallet funded from the CI funder. The subwallet pattern avoids
    # nonce collisions with the existing `ephemeral-100w-fresh-aeneid`
    # suite (and any concurrent manual dispatches), both of which share
    # the same CDR_AENEID_TEST_PRIVATE_KEY funder.
    #
    # Sequential after `verify` (not parallel): if the install / field
    # audit / smoke gates already failed, the artifact is known-broken
    # and we don't want to burn Aeneid test IP confirming the obvious.
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Aeneid endpoint constants — copied verbatim from
      # integration.yml:160-161 (single source of truth would be nicer
      # but GHA doesn't let workflows share top-level env across jobs
      # via inheritance, and a reusable-workflow indirection isn't
      # worth it for two URLs).
      CDR_API_URL: http://172.192.41.96:1317
      CDR_RPC_URL: https://aeneid.storyrpc.io
      CDR_AENEID_TEST_PRIVATE_KEY: ${{ secrets.CDR_AENEID_TEST_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Aeneid secret populated
        run: |
          if [ -z "$CDR_AENEID_TEST_PRIVATE_KEY" ]; then
            echo "::error::CDR_AENEID_TEST_PRIVATE_KEY is empty (missing repo secret)"
            exit 1
          fi

      - name: Install SDK in clean temp dir
        id: install
        run: |
          set -euo pipefail
          INSTALL_DIR="$(mktemp -d -t cdr-release-e2e-XXXXXX)"
          echo "INSTALL_DIR=$INSTALL_DIR" >> "$GITHUB_ENV"
          cd "$INSTALL_DIR"
          npm init -y > /dev/null
          # Explicit viem alongside the SDK: viem is a peerDependency
          # (packages/sdk/package.json line "peerDependencies.viem"),
          # so we pin a known-compatible version rather than relying on
          # npm's peer-auto-install heuristic to pick the right minor.
          npm install --no-package-lock \
            "@piplabs/cdr-sdk@${VERSION}" \
            "viem@^2.47"
          cp "$GITHUB_WORKSPACE/.github/scripts/post-release-aeneid-e2e.mjs" .
          echo "Installed in: $INSTALL_DIR"

      - name: Run e2e — upload + access via subwallet
        id: e2e
        # The script writes status.json on every code path (success +
        # failure) before exiting. We let the script's exit code surface
        # as the step outcome; the summary step (if: always()) reads
        # status.json regardless and renders diagnostics.
        run: |
          set -uo pipefail
          cd "$INSTALL_DIR"
          node post-release-aeneid-e2e.mjs

      - name: Write e2e summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -u
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❔" ;;
            esac
          }
          STATUS_FILE="${INSTALL_DIR:-}/status.json"
          {
            echo "## End-to-end Aeneid — \`${VERSION}\`"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Aeneid e2e | $(icon "${E2E_OUTCOME:-skipped}") \`${E2E_OUTCOME:-skipped}\` |"
            echo ""
            if [ -n "${INSTALL_DIR:-}" ] && [ -f "$STATUS_FILE" ]; then
              echo "### Run details"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Outcome | \`$(jq -r '.outcome' "$STATUS_FILE")\` |"
              echo "| Wall time | $(jq -r '.totalWallClockMs // "—"' "$STATUS_FILE") ms |"
              echo "| Subwallet | \`$(jq -r '.subwalletAddress // "—"' "$STATUS_FILE")\` |"
              echo "| Funder | \`$(jq -r '.funder.address // "—"' "$STATUS_FILE")\` |"
              echo "| Fund tx | \`$(jq -r '.funder.fundTx // "—"' "$STATUS_FILE")\` |"
              echo "| Open-condition | \`$(jq -r '.deploy.openCondition // "—"' "$STATUS_FILE")\` |"
              echo "| Vault UUID | \`$(jq -r '.upload.uuid // "—"' "$STATUS_FILE")\` |"
              echo "| Upload — allocate tx | \`$(jq -r '.upload.txAllocate // "—"' "$STATUS_FILE")\` |"
              echo "| Upload — write tx | \`$(jq -r '.upload.txWrite // "—"' "$STATUS_FILE")\` |"
              echo "| Upload latency | $(jq -r '.upload.latencyMs // "—"' "$STATUS_FILE") ms |"
              echo "| Access — read tx | \`$(jq -r '.access.txRead // "—"' "$STATUS_FILE")\` |"
              echo "| Access latency | $(jq -r '.access.latencyMs // "—"' "$STATUS_FILE") ms |"
              echo "| DataKey recovered | $(jq -r 'if .access.recovered then "✅" else "❌" end' "$STATUS_FILE") |"
              echo "| Refund tx | \`$(jq -r '.refund.tx // "—"' "$STATUS_FILE")\` |"
              echo "| Refund amount | $(jq -r '.refund.refundedWei // "—"' "$STATUS_FILE") wei |"
              echo ""
              ERR=$(jq -r '.error // ""' "$STATUS_FILE")
              if [ -n "$ERR" ] && [ "$ERR" != "null" ]; then
                echo "### Error"
                echo ""
                echo '```'
                echo "$ERR"
                echo '```'
                echo ""
              fi
              REFUND_ERR=$(jq -r '.refund.error // ""' "$STATUS_FILE")
              if [ -n "$REFUND_ERR" ] && [ "$REFUND_ERR" != "null" ]; then
                echo "### Refund error (non-fatal)"
                echo ""
                echo '```'
                echo "$REFUND_ERR"
                echo '```'
                echo ""
              fi
            else
              echo "_(no status.json — script exited before writing diagnostics)_"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
