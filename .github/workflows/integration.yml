name: Integration

run-name: integration-${{ inputs.network || 'devnet' }}-${{ inputs.test_suite || 'default' }}

# Default to read-only token; jobs that need more should override.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Network to test against
        options: [devnet, aeneid]
        default: devnet
      test_suite:
        type: choice
        description: Which suite to run (gated inside test files via TEST_SUITE env)
        options:
          # default          — basic SDK/CLI/Examples + 100w ephemeral tests
          # all              — default + 1000w perf + 60min stress (stress devnet-only)
          # 1000-wallet-performance — only the 1000-wallet perf suite
          # 1H-stress-devnet-only   — only the 60-min combined stress (DevNet only)
          - default
          - all
          - 1000-wallet-performance
          - 1H-stress-devnet-only
        default: default
  pull_request:
    branches: [main]
    paths:
      # SDK and its workspace deps — anything that affects what `pnpm build`
      # produces or how the SDK's runtime behaves.
      - 'packages/sdk/**'
      - 'packages/crypto/**'
      - 'packages/contracts/**'
      - 'apps/cli/**'
      - 'apps/examples/**'
      # Workspace-level inputs. A change to root config or the lockfile can
      # break `pnpm install` / `pnpm build` even if no source code under
      # packages/* or apps/* moved.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/integration.yml'

# PR runs cancel prior runs of the same PR; manual runs don't get cancelled
# (in particular a 1h stress run shouldn't be killed by a follow-up dispatch).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('integration-pr-{0}', github.event.pull_request.number) || format('integration-manual-{0}-{1}', inputs.network, inputs.test_suite) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      network: ${{ steps.resolve.outputs.network }}
      test_suite: ${{ steps.resolve.outputs.test_suite }}
      run_integration: ${{ steps.resolve.outputs.run_integration }}
      run_stress: ${{ steps.resolve.outputs.run_stress }}
    steps:
      - id: resolve
        name: Resolve effective inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NETWORK="${{ inputs.network }}"
            SUITE="${{ inputs.test_suite }}"
          else
            # PR trigger: always devnet, default suite (excludes perf + stress).
            NETWORK="devnet"
            SUITE="default"
          fi

          # Job gating from suite:
          #   - integration job covers default + 1000w perf (single vitest run
          #     with TEST_SUITE env steering describe.skipIf inside test files).
          #   - stress job runs only the 60-min stress (separate vitest invocation).
          case "$SUITE" in
            default|1000-wallet-performance)
              RUN_INTEGRATION=true
              RUN_STRESS=false ;;
            all)
              RUN_INTEGRATION=true
              RUN_STRESS=true ;;
            1H-stress-devnet-only)
              RUN_INTEGRATION=false
              RUN_STRESS=true ;;
            *)
              echo "::error::unknown test_suite=$SUITE"; exit 1 ;;
          esac

          echo "network=$NETWORK"        >> $GITHUB_OUTPUT
          echo "test_suite=$SUITE"       >> $GITHUB_OUTPUT
          echo "run_integration=$RUN_INTEGRATION" >> $GITHUB_OUTPUT
          echo "run_stress=$RUN_STRESS"  >> $GITHUB_OUTPUT

      - name: Validate (stress + 1000w-perf+all are DevNet-only)
        # 60-min stress is DevNet-only by design (needs anvil-0 funder).
        if: ${{ steps.resolve.outputs.run_stress == 'true' && steps.resolve.outputs.network != 'devnet' }}
        run: |
          echo "::error::test_suite=${{ steps.resolve.outputs.test_suite }} requires network=devnet (got ${{ steps.resolve.outputs.network }})"
          exit 1

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Run configuration"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Network | \`${{ steps.resolve.outputs.network }}\` |"
            echo "| Test suite | \`${{ steps.resolve.outputs.test_suite }}\` |"
            echo ""
            echo "### Downstream jobs"
            echo ""
            if [ "${{ steps.resolve.outputs.run_integration }}" = "true" ]; then
              echo "- \`integration\` will run (SDK + CLI + examples against \`${{ steps.resolve.outputs.network }}\`)"
            else
              echo "- \`integration\` **skipped** (test_suite=${{ steps.resolve.outputs.test_suite }})"
            fi
            if [ "${{ steps.resolve.outputs.run_stress }}" = "true" ]; then
              echo "- \`stress\` will run (60 min combined ephemeral-wallet stress, DevNet)"
            else
              echo "- \`stress\` **skipped** (test_suite=${{ steps.resolve.outputs.test_suite }})"
            fi
          } >> $GITHUB_STEP_SUMMARY

  integration:
    needs: prepare
    if: ${{ needs.prepare.outputs.run_integration == 'true' }}
    runs-on: ubuntu-latest
    # Suite-aware timeout: 1000-wallet perf is the heaviest non-stress case
    # (~30-50 min budgeted). Other suites finish in <15 min.
    timeout-minutes: ${{ needs.prepare.outputs.test_suite == '1000-wallet-performance' && 90 || (needs.prepare.outputs.test_suite == 'all' && 90 || 60) }}
    env:
      NETWORK: ${{ needs.prepare.outputs.network }}
      TEST_SUITE: ${{ needs.prepare.outputs.test_suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install

      # Workspace deps (`@piplabs/cdr-crypto`, `@piplabs/cdr-contracts`)
      # resolve via `main: dist/index.js`; without a build, vite fails to
      # resolve them on a fresh CI checkout.
      - run: pnpm build

      - name: Configure network env
        run: |
          case "$NETWORK" in
            devnet)
              echo "CDR_API_URL=http://172.207.250.203:1317" >> $GITHUB_ENV
              echo "CDR_RPC_URL=http://172.207.250.203:8545" >> $GITHUB_ENV
              echo "CDR_TEST_PRIVATE_KEY=${{ secrets.CDR_DEVNET_TEST_PRIVATE_KEY }}" >> $GITHUB_ENV
              ;;
            aeneid)
              echo "CDR_API_URL=http://172.192.41.96:1317" >> $GITHUB_ENV
              echo "CDR_RPC_URL=https://aeneid.storyrpc.io" >> $GITHUB_ENV
              echo "CDR_TEST_PRIVATE_KEY=${{ secrets.CDR_AENEID_TEST_PRIVATE_KEY }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Verify env populated
        run: |
          if [ -z "$CDR_TEST_PRIVATE_KEY" ]; then
            echo "::error::CDR_TEST_PRIVATE_KEY is empty (likely missing repo secret for $NETWORK)"
            exit 1
          fi

      # All three suites share the funder wallet (anvil-0 on DevNet, the
      # long-lived Aeneid wallet otherwise), so they must run sequentially —
      # parallel would collide on the nonce stream.
      - name: SDK integration
        id: sdk
        working-directory: packages/sdk
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee /tmp/sdk-integration.log

      - name: CLI integration
        id: cli
        working-directory: apps/cli
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee /tmp/cli-integration.log

      - name: Examples integration
        id: examples
        working-directory: apps/examples
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee /tmp/examples-integration.log

      - name: Write integration summary
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          CLI_OUTCOME: ${{ steps.cli.outcome }}
          EXAMPLES_OUTCOME: ${{ steps.examples.outcome }}
        run: |
          # Strip ANSI color codes; capture vitest's three summary lines if present.
          strip_ansi() { sed -E $'s/\x1b\\[[0-9;]*[a-zA-Z]//g'; }
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🛑" ;;
              *) echo "❔" ;;
            esac
          }
          summarize() {
            local title=$1 log=$2 outcome=$3 scope=$4
            local emoji; emoji=$(icon "$outcome")
            echo "### ${emoji} ${title} — \`${outcome}\`"
            echo ""
            echo "_${scope}_"
            echo ""
            if [ -f "$log" ]; then
              local files tests duration
              files=$(grep -E "Test Files" "$log" | tail -1 | strip_ansi || true)
              tests=$(grep -E "^[[:space:]]+Tests " "$log" | tail -1 | strip_ansi || true)
              duration=$(grep -E "^[[:space:]]+Duration" "$log" | tail -1 | strip_ansi || true)
              if [ -n "$files$tests$duration" ]; then
                echo '```'
                [ -n "$files" ]    && echo "$files"
                [ -n "$tests" ]    && echo "$tests"
                [ -n "$duration" ] && echo "$duration"
                echo '```'
              else
                echo "_(vitest summary not captured; check raw logs above)_"
              fi
            else
              echo "_(step did not run — no log)_"
            fi
            echo ""
          }
          {
            echo "## Integration test results"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Network | \`${NETWORK}\` |"
            echo "| Test suite | \`${TEST_SUITE}\` |"
            echo "| CDR_API_URL | \`${CDR_API_URL}\` |"
            echo "| CDR_RPC_URL | \`${CDR_RPC_URL}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "### Per-suite results"
            echo ""
            summarize "SDK integration"      /tmp/sdk-integration.log      "$SDK_OUTCOME" \
              "packages/sdk/__integration__ — story-api / observer / uploader / consumer + suite-gated ephemeral tests"
            summarize "CLI integration"      /tmp/cli-integration.log      "$CLI_OUTCOME" \
              "apps/cli/__integration__ — DKG state + upload + access + status commands"
            summarize "Examples integration" /tmp/examples-integration.log "$EXAMPLES_OUTCOME" \
              "apps/examples/__integration__ — query-dkg-state, upload-cdr, access-cdr, e2e-demo"
          } >> $GITHUB_STEP_SUMMARY

  stress:
    needs: prepare
    if: ${{ needs.prepare.outputs.run_stress == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NETWORK: ${{ needs.prepare.outputs.network }}
      TEST_SUITE: ${{ needs.prepare.outputs.test_suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install
      - run: pnpm build

      - name: Configure DevNet env
        run: |
          echo "CDR_API_URL=http://172.207.250.203:1317" >> $GITHUB_ENV
          echo "CDR_RPC_URL=http://172.207.250.203:8545" >> $GITHUB_ENV
          echo "CDR_TEST_PRIVATE_KEY=${{ secrets.CDR_DEVNET_TEST_PRIVATE_KEY }}" >> $GITHUB_ENV

      - name: Record stress start
        id: started
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Run stress (60 min)
        id: stress
        working-directory: packages/sdk
        run: |
          set -o pipefail
          pnpm test:stress 2>&1 | tee /tmp/stress-stdout.log

      - name: Upload stress log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdr-stress-log-${{ github.run_id }}
          path: /tmp/cdr-stress.log
          retention-days: 14

      - name: Write stress summary
        if: always()
        env:
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          STARTED_TS: ${{ steps.started.outputs.ts }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🛑" ;;
              *) echo "❔" ;;
            esac
          }
          emoji=$(icon "$STRESS_OUTCOME")
          now=$(date +%s)
          elapsed=$(( now - ${STARTED_TS:-$now} ))
          mins=$(( elapsed / 60 ))
          secs=$(( elapsed % 60 ))

          {
            echo "## ${emoji} Stress test — \`${STRESS_OUTCOME}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Network | DevNet (\`${CDR_API_URL}\`) |"
            echo "| Test suite | \`${TEST_SUITE}\` |"
            echo "| Funder | anvil-0 (\`${CDR_TEST_PRIVATE_KEY:+set}\`) |"
            echo "| Elapsed | ${mins}m${secs}s |"
            echo "| Log artifact | \`cdr-stress-log-${{ github.run_id }}\` (14-day retention) |"
            echo ""
            if [ -f /tmp/cdr-stress.log ]; then
              total=$(wc -l < /tmp/cdr-stress.log | tr -d ' ')
              echo "### cdr-stress.log — last 80 of ${total} lines"
              echo ""
              echo '```'
              tail -80 /tmp/cdr-stress.log
              echo '```'
            else
              echo "_(no /tmp/cdr-stress.log produced)_"
            fi
          } >> $GITHUB_STEP_SUMMARY
